<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WBD1D6JH1M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WBD1D6JH1M');
    </script>
    <title>WanderWork — Remote Jobs, AI Resume Builder & Digital Nomad Jobs</title>
    <meta name="description" content="Find remote jobs, work-from-home jobs, and digital nomad-friendly jobs. AI tools to tailor your resume, generate cover letters, and find recruiter contacts — all in one place." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WanderWork" />
    <meta property="og:title" content="WanderWork — Remote Jobs & AI Job Search" />
    <meta property="og:description" content="Find remote, work-from-home, and digital nomad-friendly jobs. AI tools to tailor your resume and cover letter per application." />
    <meta property="og:url" content="https://wanderwork.io/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WanderWork — Remote Jobs & AI Job Search" />
    <meta name="twitter:description" content="Find remote jobs and apply smarter with AI resume and cover letter tools." />

    <!-- Organization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "WanderWork",
      "url": "https://wanderwork.io",
      "logo": "https://wanderwork.io/favicon.png",
      "description": "Remote job board and AI job search platform for remote workers and digital nomads.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "support@wanderwork.io"
      },
      "sameAs": []
    }
    </script>

    <!-- WebSite structured data with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "WanderWork",
      "url": "https://wanderwork.io",
      "description": "Find remote jobs, work-from-home jobs, and digital nomad-friendly jobs with AI tools to help you apply.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://wanderwork.io/remote-jobs?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(145.48deg,#F9FAFB 0%,#F0F2F5 100%)">
        <div style="width:48px;height:48px;border-radius:50%;border:4px solid #C8DDE0;border-top-color:#1e5560;animation:ww-spin 0.75s linear infinite"></div>
        <p style="color:#787878;font-family:Manrope,sans-serif;font-size:14px;margin:0">Putting in Work</p>
      </div>
    </div>
    <style>@keyframes ww-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
